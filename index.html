<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Strategi Watch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 18px;
      border-bottom: 1px solid #26364b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #39a9ff;
    }

    .status {
      font-size: 13px;
      color: #63e6a5;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
    }

    .hero {
      text-align: center;
      padding: 35px 0 45px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #39a9ff;
    }

    .hero p {
      color: #aebed0;
      line-height: 1.6;
      font-size: 17px;
      max-width: 650px;
      margin: auto;
    }

    .watch-box {
      background: #101d2e;
      border: 1px solid #263b55;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .watch-box h2 {
      margin-bottom: 8px;
      font-size: 21px;
    }

    .watch-box p {
      color: #9fb0c3;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #344b66;
      background: #081321;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 15px 22px;
      border: none;
      border-radius: 10px;
      background: #168cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0879df;
    }

    #watchlist {
      margin-top: 20px;
    }

    .item {
      background: #081321;
      border: 1px solid #24384f;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remove {
      background: #c93c4b;
      padding: 8px 12px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: #65788e;
      font-size: 13px;
      padding: 35px 15px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Strategi <span>Watch</span></div>
  <div class="status">● Sistema activo</div>
</header>

<main>

  <section class="hero">
    <h1>Vigilancia <span>estratégica</span></h1>

    <p>
      Organiza y monitorea los activos que quieres seguir.
      Construye tu lista de vigilancia desde un solo lugar.
    </p>
  </section>

  <section class="watch-box">

    <h2>Mi lista de vigilancia</h2>

    <p>
      Escribe el símbolo de una acción o ETF que quieras seguir.
    </p>

    <div class="input-row">
      <input
        id="symbol"
        type="text"
        placeholder="Ejemplo: SPY, QQQ, NVDA, TSLA"
      >

      <button onclick="addSymbol()">
        + Añadir
      </button>
    </div>

    <div id="watchlist"></div>

  </section>

</main>

<footer>
  Strategi Watch © 2026
</footer>

<script>

  let symbols =
    JSON.parse(localStorage.getItem("strategiWatch")) || [];

  function save() {
    localStorage.setItem(
      "strategiWatch",
      JSON.stringify(symbols)
    );
  }

  function render() {

    const list = document.getElementById("watchlist");

    list.innerHTML = "";

    symbols.forEach((symbol, index) => {

      const item = document.createElement("div");

      item.className = "item";

      item.innerHTML = `
        <strong>${symbol}</strong>

        <button
          class="remove"
          onclick="removeSymbol(${index})">
          Eliminar
        </button>
      `;

      list.appendChild(item);

    });

  }

  function addSymbol() {

    const input =
      document.getElementById("symbol");

    const symbol =
      input.value.trim().toUpperCase();

    if (!symbol) return;

    if (!symbols.includes(symbol)) {
      symbols.push(symbol);
      save();
      render();
    }

    input.value = "";

  }

  function removeSymbol(index) {

    symbols.splice(index, 1);

    save();

    render();

  }

  document
    .getElementById("symbol")
    .addEventListener("keypress", function(event) {

      if (event.key === "Enter") {
        addSymbol();
      }

    });

  render();

</script>

</body>
</html>
